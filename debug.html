<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>physics debug</title>
    <style>
      html, body {
        margin: 0;
        background: #050510;
        color: #cfd3e6;
        font-family: monospace;
        height: 100%;
      }
      #wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 16px;
      }
      canvas {
        background: #000;
        border: 1px solid #333;
        cursor: crosshair;
      }
      #info {
        white-space: pre-wrap;
        font-size: 13px;
        min-height: 110px;
        max-width: 760px;
      }
      #controls {
        display: flex;
        gap: 8px;
      }
      button {
        font-family: monospace;
        font-size: 13px;
        padding: 8px 14px;
        cursor: pointer;
      }
      #presetRow {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
        padding-top: 10px;
        border-top: 1px dashed #333;
        font-size: 12px;
        opacity: 0.85;
      }
      #presets {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      #presets button {
        font-size: 12px;
        padding: 5px 10px;
      }
      #hint {
        font-size: 12px;
        opacity: 0.7;
        max-width: 600px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="c" width="600" height="600"></canvas>
      <div id="hint">click the screen to place 3 stars, then press RUN</div>
      <div id="controls">
        <button id="run">RUN</button>
        <button id="randomRun">randomize &amp; run</button>
        <button id="clear">clear placement</button>
      </div>
      <div id="presetRow">
        <span>experimental -- published periodic free-fall orbits, a constructed hierarchical triple, and published orbits with a moving start (not the main feature):</span>
        <div id="presets"></div>
      </div>
      <div id="info"></div>
    </div>
    <script type="module" src="/src/debug.js"></script>
  </body>
</html>
